<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ирисы Фишера</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin: 12px 0 4px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 20px; cursor: pointer; }
    .result { margin-top: 24px; padding: 16px; background: #e8f5e9; border-radius: 8px; font-size: 1.2em; }
  </style>
</head>
<body>
  <h1>Классификация ирисов</h1>
  <form method="post" action="/">
    <label>Длина чашелистика, см
      <input type="number" step="any" min="0" name="sepal_length" required
             value="{{ values.sepal_length if values else '' }}">
    </label>
    <label>Ширина чашелистика, см
      <input type="number" step="any" min="0" name="sepal_width" required
             value="{{ values.sepal_width if values else '' }}">
    </label>
    <label>Длина лепестка, см
      <input type="number" step="any" min="0" name="petal_length" required
             value="{{ values.petal_length if values else '' }}">
    </label>
    <label>Ширина лепестка, см
      <input type="number" step="any" min="0" name="petal_width" required
             value="{{ values.petal_width if values else '' }}">
    </label>
    <button type="submit">Отправить</button>
  </form>

  {% if result %}
  <div class="result">Это: <b>{{ result }}</b></div>
  {% endif %}
</body>
</html>
